name: Publish Paperless v5 candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Fork branch or commit to build
        required: true
        default: codex/paperless-v5-candidate
        type: string
      source_sha:
        description: Expected source commit embedded in image metadata
        required: true
        default: cf8128f284f604e7a2c6370e259656fe3931be16
        type: string
      image_tag:
        description: GHCR tag to publish
        required: true
        default: paperless-v5-candidate-cf8128f
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Verify requested source commit
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web-app
      - name: Build frontend
        run: npm run build
        working-directory: web-app
      - name: Download Go dependencies
        run: go mod download
      - name: Run Go tests
        run: go test ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Verify requested source commit
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR with ephemeral workflow token
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize GHCR repository
        id: repo
        run: echo "image_repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish amd64 image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.repo.outputs.image_repo }}:${{ inputs.image_tag }}
          build-args: |
            VERSION=${{ inputs.image_tag }}
            COMMIT=${{ inputs.source_sha }}
            BUILD_DATE=${{ github.run_started_at }}
          provenance: mode=max
          sbom: true
      - name: Attest published image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.repo.outputs.image_repo }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish immutable digest
        run: |
          printf 'image=%s@%s\n' '${{ steps.repo.outputs.image_repo }}' '${{ steps.image.outputs.digest }}'
          printf 'source=%s\n' '${{ inputs.source_sha }}'
